<!DOCTYPE html>
<html lang="en">
<head>
    <title>SpendWise</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<h1>My Budget Tracker</h1>
<h2>Track your income and expenses in one place.</h2>  

<section class="add-expense">
        <h3>Add Expense</h3>
        The Expense name: <input type="text" id="expense-name" placeholder="Enter expense name">
        The Amount: <input type="number" id="expense-amount" placeholder="Enter amount">
        The Category: <input type="text" id="expense-category" placeholder="Enter category">
</section>

<section class="your-expense">
        <h3>Your Expences</h3>
        The Expense name: <input type="text" id="your-expense-name" placeholder="No expences yet">
</section>

<script src="script.js"></script>
</body>
</html>
