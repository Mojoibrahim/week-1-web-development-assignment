<!DOCTYPE html>
<html lang="en">
<head>
    <title>SpendWise</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<h1>My Budget Tracker</h1>
<h2>Track your income and expenses in one place.</h2>  

<section class="add-expense">
        <h3>Add Expense</h3>
        <label for="expense-name">The Expense name:</label> <input type="text" id="expense-name" placeholder="Enter expense name">
        <label for="expense-amount">The Amount:</label> <input type="number" id="expense-amount" placeholder="Enter amount">
        <label for="expense-category">The Category:</label> <input type="text" id="expense-category" placeholder="Enter category">
</section>

<section class="your-expense">
        <h3>Your Expences</h3>
        <p id="your-expense-name">No expences yet</p>
</section>

<script src="script.js"></script>
</body>
</html>
